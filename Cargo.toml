[package]
name = "procharbor"
version = "1.3.0"
edition = "2024"
description = "A native Linux task manager and system monitor written in Rust"
license = "MIT"
repository = "https://github.com/shripad-jyothinath/procharbor"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "system_fonts"] }
egui_extras = { version = "0.37.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
resvg = { version = "0.50.0", default-features = false, features = ["svgz"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
