[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "procharbor"
version = "1.3.0"
description = "Native Linux task manager and system monitor with real-time resource tracking"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shripad", email = "shripad-jyothinath@users.noreply.github.com" }]
keywords = ["task-manager", "system-monitor", "linux", "gui", "process-manager", "hardware-info", "egui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/shripad-jyothinath/procharbor"
Repository = "https://github.com/shripad-jyothinath/procharbor.git"
Documentation = "https://shripad-jyothinath.github.io/procharbor"

[tool.maturin]
bindings = "bin"
strip = true
